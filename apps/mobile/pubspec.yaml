name: vibes
description: VIBES — حجز المزارع وقاعات الأعراس وخدمات التزيين في العراق
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  dio: ^5.8.0+1
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.5.3
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  flutter_animate: ^4.5.2
  easy_localization: ^3.0.7
  intl: ^0.20.2
  google_fonts: ^6.2.1
  geolocator: ^13.0.2
  # Media & immersive experience
  video_player: ^2.9.2
  chewie: ^1.8.5
  photo_view: ^0.15.0
  flutter_svg: ^2.0.10
  # Maps (OSM — no API keys)
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  # Motion & delight
  rive: ^0.13.20
  # Platform integration
  image_picker: ^1.1.2
  url_launcher: ^6.3.1
  share_plus: ^10.0.2
  # Provider window
  table_calendar: ^3.1.1
  fl_chart: ^0.69.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/translations/
