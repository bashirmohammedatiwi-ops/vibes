# منافذ المضيف لهذا المشروع فقط، حتى لا تتعارض مع تطبيقات أخرى على الخادم:
# 6001/tcp  الموقع ولوحة التحكم وواجهة البرمجة عبر nginx
# 6002/tcp  إشارة مكالمات LiveKit
# 6003/tcp  احتياط صوت LiveKit
# 6004-6033/udp وسائط الصوت
# Postgres و Redis يبقيان داخل شبكة Docker ولا يُنشران على المضيف.

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: vibes-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 15s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 2G
    networks:
      - vibes

  redis:
    image: redis:7-alpine
    container_name: vibes-redis
    restart: always
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "200mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - vibes

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: vibes-api
    restart: always
    env_file:
      - .env
    environment:
      NODE_ENV: production
      APP_PORT: 3000
      MEDIA_ROOT: /app/uploads
      LIVEKIT_URL: ${LIVEKIT_URL}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
    volumes:
      - media_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      livekit:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 768M
    networks:
      - vibes

  admin:
    build:
      context: ./apps/admin
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_MAPBOX_ACCESS_TOKEN: ${MAPBOX_ACCESS_TOKEN}
        NEXT_PUBLIC_API_URL: ${APP_URL}
        NEXT_PUBLIC_BASE_PATH: /admin
    container_name: vibes-admin
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3001
      NEXT_PUBLIC_API_URL: ${APP_URL}
      NEXT_PUBLIC_MAPBOX_ACCESS_TOKEN: ${MAPBOX_ACCESS_TOKEN}
    depends_on:
      api:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - vibes

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${APP_URL}
        NEXT_PUBLIC_MAPBOX_ACCESS_TOKEN: ${MAPBOX_ACCESS_TOKEN}
    container_name: vibes-web
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3002
      API_INTERNAL_URL: http://api:3000
      NEXT_PUBLIC_API_URL: ${APP_URL}
      NEXT_PUBLIC_SITE_URL: ${APP_URL}
    depends_on:
      api:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - vibes

  livekit:
    image: livekit/livekit-server:v1.9.4
    container_name: vibes-livekit
    restart: always
    command: --config /etc/livekit.yaml --node-ip ${LIVEKIT_NODE_IP}
    # شبكة المضيف مباشرة: يلغي docker-proxy (أداء أعلى + كل منافذ
    # الترحيل 30000-40000 تعمل فوراً بدون نشر كل منفذ يدوياً)
    network_mode: host
    volumes:
      - ./docker/livekit.prod.yaml:/etc/livekit.yaml:ro
    # فحص صحة دوري — يعيد الحاوية تلقائياً إن تجمّدت الإشارة
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:6002/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          # 38MB فعلياً في وضع الخمول — 256M سخي لمكالمات صوتية محدودة
          memory: 256M

  nginx:
    image: nginx:alpine
    container_name: vibes-nginx
    restart: always
    ports:
      - "6001:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/certs:/etc/nginx/certs:ro
      - media_uploads:/var/media:ro
    depends_on:
      api:
        condition: service_healthy
      admin:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 128M
    networks:
      - vibes

volumes:
  postgres_data:
  redis_data:
  media_uploads:

networks:
  vibes:
    driver: bridge
