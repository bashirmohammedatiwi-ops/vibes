services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: vibes-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 15s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 2G
    networks:
      - vibes

  redis:
    image: redis:7-alpine
    container_name: vibes-redis
    restart: always
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "200mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - vibes

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: vibes-api
    restart: always
    env_file:
      - .env
    environment:
      NODE_ENV: production
      APP_PORT: 3000
      MEDIA_ROOT: /app/uploads
    volumes:
      - media_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 768M
    networks:
      - vibes

  admin:
    build:
      context: ./apps/admin
      dockerfile: Dockerfile
    container_name: vibes-admin
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3001
      NEXT_PUBLIC_API_URL: ${APP_URL}
    depends_on:
      api:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - vibes

  nginx:
    image: nginx:alpine
    container_name: vibes-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/certs:/etc/nginx/certs:ro
      - media_uploads:/var/media:ro
    depends_on:
      api:
        condition: service_healthy
      admin:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 128M
    networks:
      - vibes

volumes:
  postgres_data:
  redis_data:
  media_uploads:

networks:
  vibes:
    driver: bridge
