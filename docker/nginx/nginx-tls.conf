# VIBES — Nginx TLS / wss
# =============================================================================
# نسخة التشغيل الآمنة (الإنتاج):
#   • HTTPS 443  للموقع + لوحة التحكم + واجهة البرمجة
#   • wss 6002  إشارة مكالمات LiveKit مُشفّرة عبر WebSocket آمن
#
# المتطلبات:
#   • شهادة SSL (fullchain.pem + privkey.pem) في docker/nginx/certs/
#   • أن يُشير الدومين (A record) إلى هذا السيرفر
#
# للحصول على الشهادة (Certbot على الـ VPS):
#   sudo apt install certbot
#   sudo certbot certonly --standalone -d vibes.iq
#   sudo cp /etc/letsencrypt/live/vibes.iq/fullchain.pem docker/nginx/certs/
#   sudo cp /etc/letsencrypt/live/vibes.iq/privkey.pem  docker/nginx/certs/
# أو ضع Cloudflare (Full SSL) أمام السيرفر — عندها استخدم شهادة
# Origin Certificate التي تصدرها Cloudflare مجاناً (صالحة 15 سنة).
# =============================================================================

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    client_max_body_size 512m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    # ترقية الاتصال إلى WebSocket عند الحاجة
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream api {
        server api:3000;
    }

    upstream admin {
        server admin:3001;
    }

    upstream livekit_signaling {
        server livekit:6002;
    }

    # ---------------------------------------------------------------------------
    # HTTPS — الموقع والـ API ولوحة التحكم (443)
    # ---------------------------------------------------------------------------
    server {
        listen 443 ssl;
        http2 on;
        server_name vibes.iq;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # HSTS — أخبر المتصفحات/التطبيق بالبقاء على HTTPS دائماً
        add_header Strict-Transport-Security "max-age=63072000" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;

        location /api/docs {
            proxy_pass http://api/api/docs;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api {
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /health {
            proxy_pass http://api/health;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        location = /admin {
            return 302 /admin/;
        }

        location /admin/ {
            proxy_pass http://admin/;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /media/ {
            alias /var/media/;
            expires 7d;
            add_header Cache-Control "public";
        }

        location / {
            return 302 /admin;
        }
    }

    # ---------------------------------------------------------------------------
    # wss — إشارة مكالمات LiveKit مُشفّرة (6002 → داخل الشبكة ws://livekit:6002)
    # الهاتف يتصل wss://vibes.iq:6002 — نفس شهادة HTTPS
    # ---------------------------------------------------------------------------
    server {
        listen 6002 ssl;
        server_name vibes.iq;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:WSS:10m;

        # مهلات طويلة — اتصالات WebSocket يجب ألا تُغلق أثناء مكالمة
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        location / {
            proxy_pass http://livekit_signaling;
        }
    }

    # ---------------------------------------------------------------------------
    # HTTP 80 → HTTPS (تحديث Certbot + تحويل الزوار)
    # ---------------------------------------------------------------------------
    server {
        listen 80;
        server_name vibes.iq;
        location ^~ /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }
        location / {
            return 301 https://$host$request_uri;
        }
    }
}
