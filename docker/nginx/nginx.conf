# تصغير الصور عند الطلب (image_filter) — /media/w/<عرض>/<ملف>
load_module modules/ngx_http_image_filter_module.so;

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    client_max_body_size 512m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    # نسخ الصور المصغّرة تُحفظ على القرص — كل مقاس يُولَّد مرة واحدة فقط
    proxy_cache_path /var/cache/nginx/img levels=1:2 keys_zone=img:20m max_size=3g inactive=60d use_temp_path=off;

    # خلف nginx المشترك (vibesiraq.com): IP الزبون الحقيقي والبروتوكول (https)
    # يأتيان منه — لا نثق بهذه الترويسات إلا من شبكات docker الداخلية.
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 127.0.0.1;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    map $http_x_forwarded_proto $fwd_proto {
        default $http_x_forwarded_proto;
        ""      $scheme;
    }

    upstream api {
        server api:3000;
    }

    upstream admin {
        server admin:3001;
    }

    server {
        listen 80;
        server_name _;
        absolute_redirect off;

        location /api/docs {
            proxy_pass http://api/api/docs;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $fwd_proto;
        }

        location /api {
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $fwd_proto;
        }

        location /health {
            proxy_pass http://api/health;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # /admin و /admin/* — تمرير مباشر بدون حذف البادئة (Next basePath=/admin
        # يوحّد الشرطة المائلة بنفسه، فلا حاجة لتحويلات هنا تسبب حلقات)
        location /admin {
            proxy_pass http://admin;
            proxy_http_version 1.1;
            proxy_set_header X-Forwarded-Prefix /admin;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $fwd_proto;
        }

        # صورة مصغّرة بعرض محدد من قائمة ثابتة (تمنع توليد مقاسات عشوائية)
        location ~ "^/media/w/(240|360|480|640|800|960|1080|1440)/([A-Za-z0-9_.-]+\.(?:jpe?g|png|webp|gif))$" {
            proxy_pass http://127.0.0.1:8099/resize/$1/$2;
            proxy_cache img;
            proxy_cache_key /media/w/$1/$2;
            proxy_cache_valid 200 60d;
            proxy_cache_valid 404 1m;
            proxy_cache_lock on;
            proxy_cache_use_stale error timeout updating;
            expires 30d;
            add_header Cache-Control "public, immutable";
            add_header X-Image-Cache $upstream_cache_status;
        }

        # توافق مع إصدارات التطبيق السابقة (/media/w480/… و /media/w960/…)
        location ~ "^/media/w(480|960)/([A-Za-z0-9_.-]+\.(?:jpe?g|png|webp|gif))$" {
            proxy_pass http://127.0.0.1:8099/resize/$1/$2;
            proxy_cache img;
            proxy_cache_key /media/w/$1/$2;
            proxy_cache_valid 200 60d;
            proxy_cache_valid 404 1m;
            proxy_cache_lock on;
            proxy_cache_use_stale error timeout updating;
            expires 30d;
            add_header Cache-Control "public, immutable";
            add_header X-Image-Cache $upstream_cache_status;
        }

        location /media/ {
            alias /var/media/;
            expires 30d;
            add_header Cache-Control "public";
        }

        location / {
            return 302 /admin;
        }
    }

    # خادم داخلي يصغّر الصورة الأصلية — لا يُنشر خارج الحاوية
    server {
        listen 127.0.0.1:8099;
        access_log off;

        location ~ "^/resize/(\d+)/(.+)$" {
            alias /var/media/$2;
            image_filter resize $1 -;
            image_filter_jpeg_quality 80;
            image_filter_webp_quality 80;
            image_filter_interlace on;
            image_filter_buffer 25M;
        }
    }
}
