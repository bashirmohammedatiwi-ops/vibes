# ═══ VIBES — vibesiraq.com ═══
# يُركَّب في nginx المشترك على السيرفر (infra-nginx-1 — مشروع alhayaa) كملف
# مستقل: /root/alhayaa/infra/nginx/vibes.conf → /etc/nginx/conf.d/vibes.conf
# لا يمس deemaalhayat.com. يمرّر كل شيء إلى nginx الخاص بـ VIBES (منفذ المضيف
# 6001)، وإشارة المكالمات LiveKit (/rtc) إلى 6002.
# 172.16.2.1 = بوابة شبكة infra_internal (المضيف).

server {
    listen 80;
    listen [::]:80;
    server_name vibesiraq.com www.vibesiraq.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    location / {
        return 301 https://vibesiraq.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.vibesiraq.com;

    ssl_certificate /etc/letsencrypt/live/vibesiraq.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vibesiraq.com/privkey.pem;
    include /etc/nginx/conf.d/ssl-params.conf;

    return 301 https://vibesiraq.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name vibesiraq.com;

    ssl_certificate /etc/letsencrypt/live/vibesiraq.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vibesiraq.com/privkey.pem;
    include /etc/nginx/conf.d/ssl-params.conf;

    client_max_body_size 512m;

    # إشارة المكالمات (WebSocket) — wss://vibesiraq.com/rtc
    location /rtc {
        proxy_pass http://172.16.2.1:6002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass http://172.16.2.1:6001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
